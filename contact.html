<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Contact — YK. Portfolio</title>
  <meta name="description" content="Get in touch with YK. — Designer, Developer, Student. Let's make something useful." />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body style="background-color: var(--bg-body); overflow: hidden;">

  <!-- Two26 Studio Exact Fullscreen Contact Page Experience -->
  <div class="contact-page is-active" id="contact-modal" style="display: flex; visibility: visible; pointer-events: auto;">
    <!-- Background SVG Wipe Transition Layer -->
    <div class="contact-transition" aria-hidden="true">
      <div class="svg-tcontact">
        <svg width="100%" height="auto" viewBox="0 0 998 901" fill="none" preserveAspectRatio="none">
          <path id="contact-transition-path" d="M372.5 886C372.5 886 879.181 886 855 766.5C801.982 504.5 19.5 1042.52 19.5 646.5C19.5 316.5 952.535 583.56 978 318.5C1000 89.5 193.6 431.263 111 221C34.6544 26.6589 565 19 565 19" stroke="#FF5400" stroke-width="0" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Contact Top Navigation Bar -->
    <div class="contact-navbar">
      <div class="navbar-logo-contact">
        <a href="/index.html" style="text-decoration: none;">
          <span class="contact-logo-wordmark">YK<span class="dot">.</span></span>
        </a>
      </div>
      <div class="close-btn-wrapper">
        <a href="/index.html" class="close-btn contact-close-btn" id="contact-close-btn" aria-label="Close Contact View">
          <div class="back-arrow">
            <svg width="10" height="10" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6.86328 0.5L0.499281 6.864M6.86328 6.864L0.499281 0.5"/>
            </svg>
          </div>
          <span class="back-btn-txt">Close</span>
        </a>
      </div>
    </div>

    <!-- Contact Editorial Content -->
    <div class="contact-content">
      <div class="contact-left">
        <h2 class="contact-heading">WANT TO</h2>
        <h2 class="contact-heading">START</h2>
        <h2 class="contact-heading right">A NEW</h2>
        <h2 class="contact-heading left">PROJECT?</h2>
        <p class="contact-para left">or just say hello!</p>
      </div>

      <div class="contact-right">
        <div class="contact-email-wrap">
          <div class="email-heading">Direct Inquiries &amp; Projects</div>
          <a href="mailto:yokeshkumar192007@gmail.com?subject=Project%20Inquiry" class="email-link">yokeshkumar192007@gmail.com</a>
        </div>

        <div class="contact-email-wrap">
          <div class="email-heading">Campus &amp; Collaboration</div>
          <a href="mailto:yokeshkumar.250408@aids.ritchennai.edu.in?subject=Collaboration" class="email-link">yokeshkumar.250408@aids.ritchennai.edu.in</a>
        </div>

        <div class="contact-social-row">
          <a href="https://github.com/yokeshkumar19" target="_blank" rel="noopener noreferrer" class="contact-social">
            <span class="contact-social-link">GitHub ↗</span>
          </a>
          <a href="https://www.linkedin.com/in/yokesh-kumar-9597b0394/" target="_blank" rel="noopener noreferrer" class="contact-social">
            <span class="contact-social-link">LinkedIn ↗</span>
          </a>
          <a href="mailto:yokeshkumar192007@gmail.com" class="contact-social">
            <span class="contact-social-link">Email ↗</span>
          </a>
        </div>
      </div>
    </div>

    <!-- Two26 Signature Contact Illustration Art -->
    <div class="contact-img-wrap" aria-hidden="true">
      <img src="/assets/contact-art.svg" loading="lazy" alt="Contact Illustration" class="contact-img" />
    </div>
  </div>

  <script type="module" src="/src/contact-page.js"></script>
</body>
</html>
