  <circle cx="820" cy="380" r="10" fill="#FF5A1F" stroke="#FFF" stroke-width="3"/>
  <text x="820" y="415" fill="#F5F3ED" font-family="'Neue Montreal', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Academic Block 3</text>

  <circle cx="1060" cy="240" r="8" fill="#0B0B0B" stroke="#10B981" stroke-width="3"/>
