    <text x="397" y="54" fill="#FF5A1F" font-family="'Neue Montreal', sans-serif" font-size="11" font-weight="600" text-anchor="middle">ETA</text>
    <text x="397" y="72" fill="#F5F3ED" font-family="'MD Nichrome', sans-serif" font-size="16" font-weight="700" text-anchor="middle">4 min</text>
